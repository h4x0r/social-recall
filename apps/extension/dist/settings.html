<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Social Recall Settings</title>
  <link rel="stylesheet" href="settings.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="settings">
    <!-- Header -->
    <div class="settings__header">
      <div class="settings__logo">
        <span class="settings__diamond">&#9671;</span>
        <span class="settings__title">Settings</span>
        <span class="settings__diamond">&#9671;</span>
      </div>
    </div>

    <!-- Accounts Section -->
    <div class="settings__section">
      <div class="settings__section-header">
        <span class="settings__label">CONNECTED ACCOUNTS</span>
      </div>

      <!-- Google Account -->
      <div class="settings__account" id="googleAccount">
        <div class="settings__account-icon settings__account-icon--google">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
        </div>
        <div class="settings__account-info">
          <div class="settings__account-provider">Google</div>
          <div class="settings__account-email" id="googleEmail">Not connected</div>
        </div>
        <div class="settings__account-status" id="googleStatus">
          <span class="settings__status-dot"></span>
        </div>
      </div>

      <!-- iCloud Account (Coming Soon) -->
      <div class="settings__account settings__account--disabled">
        <div class="settings__account-icon settings__account-icon--icloud">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="#999">
            <path d="M19.35 10.04A7.49 7.49 0 0012 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 000 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
          </svg>
        </div>
        <div class="settings__account-info">
          <div class="settings__account-provider">iCloud</div>
          <div class="settings__account-email">Coming soon</div>
        </div>
        <div class="settings__account-badge">Soon</div>
      </div>
    </div>

    <!-- Connection Section -->
    <div class="settings__section" id="connectionSection">
      <div class="settings__section-header">
        <span class="settings__label">CONNECTION</span>
      </div>

      <div class="settings__connection-actions">
        <button class="settings__btn settings__btn--primary" id="connectBtn" style="display: none;">
          <span class="settings__btn-icon">&#8594;</span>
          Connect Account
        </button>
        <button class="settings__btn settings__btn--danger" id="logoutBtn" style="display: none;">
          <span class="settings__btn-icon">&#8592;</span>
          Disconnect
        </button>
      </div>
    </div>

    <!-- Data Management Section -->
    <div class="settings__section">
      <div class="settings__section-header">
        <span class="settings__label">DATA MANAGEMENT</span>
      </div>

      <div class="settings__data-actions">
        <button class="settings__btn settings__btn--secondary" id="exportBtn">
          <span class="settings__btn-icon">&#8595;</span>
          Export Data
        </button>
        <button class="settings__btn settings__btn--secondary" id="importBtn">
          <span class="settings__btn-icon">&#8593;</span>
          Import Data
        </button>
      </div>
    </div>

    <!-- Advanced Section -->
    <div class="settings__section">
      <div class="settings__section-header">
        <span class="settings__label">ADVANCED</span>
      </div>

      <div class="settings__field">
        <label class="settings__field-label">Web App URL</label>
        <div class="settings__field-row">
          <input type="text" id="webAppUrl" class="settings__input" placeholder="https://social-recall.vercel.app">
          <button class="settings__btn settings__btn--small" id="saveUrlBtn">Save</button>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="settings__footer">
      <span class="settings__diamond-small">&#9671;</span>
      <span class="settings__version">v0.0.5</span>
      <span class="settings__diamond-small">&#9671;</span>
    </div>
  </div>
  <script src="settings.js"></script>
</body>
</html>
