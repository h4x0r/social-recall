<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 144">
  <defs>
    <linearGradient id="chariot-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#2a2a2a"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect width="96" height="144" rx="4" fill="url(#chariot-bg)"/>
  <rect x="2" y="2" width="92" height="140" rx="3" fill="none" stroke="#c9a227" stroke-width="1.5"/>

  <!-- Art deco corner decorations -->
  <path d="M8 8 L20 8 L20 12 L12 12 L12 20 L8 20 Z" fill="#c9a227" opacity="0.6"/>
  <path d="M88 8 L76 8 L76 12 L84 12 L84 20 L88 20 Z" fill="#c9a227" opacity="0.6"/>
  <path d="M8 136 L20 136 L20 132 L12 132 L12 124 L8 124 Z" fill="#c9a227" opacity="0.6"/>
  <path d="M88 136 L76 136 L76 132 L84 132 L84 124 L88 124 Z" fill="#c9a227" opacity="0.6"/>

  <!-- Stars above (canopy of stars) -->
  <polygon points="35,16 36,18 38,18 36.5,19.5 37,22 35,20.5 33,22 33.5,19.5 32,18 34,18" fill="#c9a227"/>
  <polygon points="48,14 49,16 51,16 49.5,17.5 50,20 48,18.5 46,20 46.5,17.5 45,16 47,16" fill="#c9a227"/>
  <polygon points="61,16 62,18 64,18 62.5,19.5 63,22 61,20.5 59,22 59.5,19.5 58,18 60,18" fill="#c9a227"/>

  <!-- Canopy structure -->
  <path d="M25 25 L48 18 L71 25 L71 45 L25 45 Z" fill="none" stroke="#c9a227" stroke-width="1.5"/>
  <line x1="25" y1="25" x2="25" y2="75" stroke="#c9a227" stroke-width="1.5"/>
  <line x1="71" y1="25" x2="71" y2="75" stroke="#c9a227" stroke-width="1.5"/>

  <!-- Charioteer figure -->
  <circle cx="48" cy="38" r="6" fill="none" stroke="#f5f2eb" stroke-width="1.5"/>

  <!-- Crown/laurel -->
  <path d="M42 33 L48 30 L54 33" fill="none" stroke="#c9a227" stroke-width="1"/>

  <!-- Armor/body -->
  <rect x="40" y="44" width="16" height="20" fill="none" stroke="#f5f2eb" stroke-width="1.5"/>

  <!-- Square on chest (representing willpower) -->
  <rect x="44" y="48" width="8" height="8" fill="none" stroke="#c9a227" stroke-width="1"/>

  <!-- Arms holding reins -->
  <line x1="40" y1="50" x2="30" y2="60" stroke="#f5f2eb" stroke-width="1.5"/>
  <line x1="56" y1="50" x2="66" y2="60" stroke="#f5f2eb" stroke-width="1.5"/>

  <!-- Chariot body -->
  <rect x="20" y="75" width="56" height="15" fill="none" stroke="#c9a227" stroke-width="1.5"/>

  <!-- Winged sun on chariot front -->
  <circle cx="48" cy="82" r="4" fill="#c9a227"/>
  <path d="M36 82 L44 80 M36 82 L44 84" stroke="#c9a227" stroke-width="1"/>
  <path d="M60 82 L52 80 M60 82 L52 84" stroke="#c9a227" stroke-width="1"/>

  <!-- Wheels -->
  <circle cx="25" cy="95" r="8" fill="none" stroke="#c9a227" stroke-width="1.5"/>
  <line x1="25" y1="87" x2="25" y2="103" stroke="#c9a227" stroke-width="1"/>
  <line x1="17" y1="95" x2="33" y2="95" stroke="#c9a227" stroke-width="1"/>
  <circle cx="71" cy="95" r="8" fill="none" stroke="#c9a227" stroke-width="1.5"/>
  <line x1="71" y1="87" x2="71" y2="103" stroke="#c9a227" stroke-width="1"/>
  <line x1="63" y1="95" x2="79" y2="95" stroke="#c9a227" stroke-width="1"/>

  <!-- Bottom decorative line -->
  <line x1="24" y1="108" x2="72" y2="108" stroke="#c9a227" stroke-width="1"/>

  <!-- Card name -->
  <text x="48" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#c9a227" font-weight="600">THE</text>
  <text x="48" y="133" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#c9a227" font-weight="600">CHARIOT</text>
</svg>
