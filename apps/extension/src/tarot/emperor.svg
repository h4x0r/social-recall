<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 144">
  <defs>
    <linearGradient id="emperor-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#2a2a2a"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect width="96" height="144" rx="4" fill="url(#emperor-bg)"/>
  <rect x="2" y="2" width="92" height="140" rx="3" fill="none" stroke="#c9a227" stroke-width="1.5"/>

  <!-- Art deco corner decorations -->
  <path d="M8 8 L20 8 L20 12 L12 12 L12 20 L8 20 Z" fill="#c9a227" opacity="0.6"/>
  <path d="M88 8 L76 8 L76 12 L84 12 L84 20 L88 20 Z" fill="#c9a227" opacity="0.6"/>
  <path d="M8 136 L20 136 L20 132 L12 132 L12 124 L8 124 Z" fill="#c9a227" opacity="0.6"/>
  <path d="M88 136 L76 136 L76 132 L84 132 L84 124 L88 124 Z" fill="#c9a227" opacity="0.6"/>

  <!-- Top decorative band -->
  <rect x="20" y="16" width="56" height="3" fill="#c9a227"/>
  <polygon points="48,12 52,16 48,20 44,16" fill="#c9a227"/>

  <!-- Throne back - geometric columns -->
  <rect x="18" y="30" width="6" height="70" fill="none" stroke="#c9a227" stroke-width="1"/>
  <rect x="72" y="30" width="6" height="70" fill="none" stroke="#c9a227" stroke-width="1"/>

  <!-- Throne top decoration -->
  <path d="M18 30 L24 25 L48 22 L72 25 L78 30" fill="none" stroke="#c9a227" stroke-width="1.5"/>

  <!-- Ram heads on throne (simplified geometric) -->
  <circle cx="21" cy="35" r="4" fill="none" stroke="#c9a227" stroke-width="1"/>
  <path d="M17 33 L15 30" stroke="#c9a227" stroke-width="1"/>
  <path d="M25 33 L27 30" stroke="#c9a227" stroke-width="1"/>
  <circle cx="75" cy="35" r="4" fill="none" stroke="#c9a227" stroke-width="1"/>
  <path d="M71 33 L69 30" stroke="#c9a227" stroke-width="1"/>
  <path d="M79 33 L81 30" stroke="#c9a227" stroke-width="1"/>

  <!-- Emperor figure -->
  <circle cx="48" cy="45" r="7" fill="none" stroke="#f5f2eb" stroke-width="1.5"/>

  <!-- Crown -->
  <path d="M41 38 L43 42 L48 40 L53 42 L55 38" fill="none" stroke="#c9a227" stroke-width="1.5"/>

  <!-- Body on throne -->
  <path d="M38 52 L48 50 L58 52 L60 85 L48 88 L36 85 Z" fill="none" stroke="#f5f2eb" stroke-width="1.5"/>

  <!-- Scepter in right hand -->
  <line x1="58" y1="58" x2="72" y2="50" stroke="#c9a227" stroke-width="2"/>
  <polygon points="72,48 76,50 72,52 70,50" fill="#c9a227"/>

  <!-- Orb in left hand -->
  <circle cx="32" cy="65" r="5" fill="none" stroke="#c9a227" stroke-width="1.5"/>
  <line x1="32" y1="60" x2="32" y2="70" stroke="#c9a227" stroke-width="1"/>
  <line x1="27" y1="65" x2="37" y2="65" stroke="#c9a227" stroke-width="1"/>

  <!-- Throne seat -->
  <rect x="28" y="88" width="40" height="6" fill="none" stroke="#c9a227" stroke-width="1"/>

  <!-- Legs -->
  <line x1="42" y1="94" x2="38" y2="100" stroke="#f5f2eb" stroke-width="1.5"/>
  <line x1="54" y1="94" x2="58" y2="100" stroke="#f5f2eb" stroke-width="1.5"/>

  <!-- Bottom decorative line -->
  <line x1="24" y1="108" x2="72" y2="108" stroke="#c9a227" stroke-width="1"/>

  <!-- Card name -->
  <text x="48" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#c9a227" font-weight="600">THE</text>
  <text x="48" y="133" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#c9a227" font-weight="600">EMPEROR</text>
</svg>
