<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 144">
  <defs>
    <linearGradient id="hermit-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#2a2a2a"/>
    </linearGradient>
    <radialGradient id="lantern-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#c9a227;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#c9a227;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Card background -->
  <rect width="96" height="144" rx="4" fill="url(#hermit-bg)"/>
  <rect x="2" y="2" width="92" height="140" rx="3" fill="none" stroke="#c9a227" stroke-width="1.5"/>

  <!-- Art deco corner decorations -->
  <path d="M8 8 L20 8 L20 12 L12 12 L12 20 L8 20 Z" fill="#c9a227" opacity="0.6"/>
  <path d="M88 8 L76 8 L76 12 L84 12 L84 20 L88 20 Z" fill="#c9a227" opacity="0.6"/>
  <path d="M8 136 L20 136 L20 132 L12 132 L12 124 L8 124 Z" fill="#c9a227" opacity="0.6"/>
  <path d="M88 136 L76 136 L76 132 L84 132 L84 124 L88 124 Z" fill="#c9a227" opacity="0.6"/>

  <!-- Stars in background -->
  <polygon points="20,25 21,27 23,27 21.5,28.5 22,31 20,29.5 18,31 18.5,28.5 17,27 19,27" fill="#c9a227" opacity="0.5"/>
  <polygon points="75,20 76,22 78,22 76.5,23.5 77,26 75,24.5 73,26 73.5,23.5 72,22 74,22" fill="#c9a227" opacity="0.5"/>
  <polygon points="82,35 83,37 85,37 83.5,38.5 84,41 82,39.5 80,41 80.5,38.5 79,37 81,37" fill="#c9a227" opacity="0.5"/>

  <!-- Lantern glow -->
  <circle cx="68" cy="42" r="15" fill="url(#lantern-glow)"/>

  <!-- Lantern -->
  <rect x="62" y="36" width="12" height="16" fill="none" stroke="#c9a227" stroke-width="1.5"/>
  <line x1="62" y1="40" x2="74" y2="40" stroke="#c9a227" stroke-width="1"/>
  <line x1="62" y1="48" x2="74" y2="48" stroke="#c9a227" stroke-width="1"/>
  <polygon points="68,33 64,36 72,36" fill="none" stroke="#c9a227" stroke-width="1"/>

  <!-- Six-pointed star inside lantern -->
  <polygon points="68,41 70,44 67,44" fill="#c9a227"/>
  <polygon points="68,47 70,44 66,44" fill="#c9a227"/>

  <!-- Hermit figure - hooded -->
  <path d="M38 40 L48 35 L58 40 L55 55 L48 58 L41 55 Z" fill="none" stroke="#f5f2eb" stroke-width="1.5"/>

  <!-- Face within hood -->
  <circle cx="48" cy="48" r="5" fill="none" stroke="#f5f2eb" stroke-width="1"/>

  <!-- Robe -->
  <path d="M35 55 L48 52 L61 55 L65 100 L48 105 L31 100 Z" fill="none" stroke="#f5f2eb" stroke-width="1.5"/>

  <!-- Staff -->
  <line x1="30" y1="45" x2="25" y2="100" stroke="#c9a227" stroke-width="2"/>

  <!-- Arm holding lantern -->
  <line x1="55" y1="60" x2="65" y2="52" stroke="#f5f2eb" stroke-width="1.5"/>

  <!-- Mountain peaks at base -->
  <path d="M15 100 L28 85 L38 100" fill="none" stroke="#c9a227" stroke-width="1"/>
  <path d="M58 100 L68 88 L78 100" fill="none" stroke="#c9a227" stroke-width="1"/>

  <!-- Bottom decorative line -->
  <line x1="24" y1="108" x2="72" y2="108" stroke="#c9a227" stroke-width="1"/>

  <!-- Card name -->
  <text x="48" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#c9a227" font-weight="600">THE</text>
  <text x="48" y="133" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#c9a227" font-weight="600">HERMIT</text>
</svg>
