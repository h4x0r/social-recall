<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 144">
  <defs>
    <linearGradient id="priestess-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#2a2a2a"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect width="96" height="144" rx="4" fill="url(#priestess-bg)"/>
  <rect x="2" y="2" width="92" height="140" rx="3" fill="none" stroke="#c9a227" stroke-width="1.5"/>

  <!-- Art deco corner decorations -->
  <path d="M8 8 L20 8 L20 12 L12 12 L12 20 L8 20 Z" fill="#c9a227" opacity="0.6"/>
  <path d="M88 8 L76 8 L76 12 L84 12 L84 20 L88 20 Z" fill="#c9a227" opacity="0.6"/>
  <path d="M8 136 L20 136 L20 132 L12 132 L12 124 L8 124 Z" fill="#c9a227" opacity="0.6"/>
  <path d="M88 136 L76 136 L76 132 L84 132 L84 124 L88 124 Z" fill="#c9a227" opacity="0.6"/>

  <!-- Pillars - B and J -->
  <rect x="14" y="25" width="10" height="75" fill="none" stroke="#c9a227" stroke-width="1.5"/>
  <text x="19" y="45" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#c9a227" font-weight="600">B</text>

  <rect x="72" y="25" width="10" height="75" fill="none" stroke="#f5f2eb" stroke-width="1.5"/>
  <text x="77" y="45" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#f5f2eb" font-weight="600">J</text>

  <!-- Veil between pillars (pomegranates pattern) -->
  <line x1="24" y1="25" x2="24" y2="100" stroke="#c9a227" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="72" y1="25" x2="72" y2="100" stroke="#c9a227" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- Crescent moon crown -->
  <path d="M40 22 C35 22 32 28 35 32 C32 28 35 22 42 22" fill="none" stroke="#c9a227" stroke-width="1.5"/>
  <circle cx="48" cy="20" r="5" fill="none" stroke="#c9a227" stroke-width="1.5"/>
  <path d="M56 22 C61 22 64 28 61 32 C64 28 61 22 54 22" fill="none" stroke="#c9a227" stroke-width="1.5"/>

  <!-- High Priestess figure -->
  <circle cx="48" cy="38" r="7" fill="none" stroke="#f5f2eb" stroke-width="1.5"/>

  <!-- Robes -->
  <path d="M36 45 L48 42 L60 45 L64 100 L48 105 L32 100 Z" fill="none" stroke="#f5f2eb" stroke-width="1.5"/>

  <!-- Cross on chest -->
  <line x1="48" y1="50" x2="48" y2="62" stroke="#c9a227" stroke-width="1.5"/>
  <line x1="43" y1="55" x2="53" y2="55" stroke="#c9a227" stroke-width="1.5"/>

  <!-- Scroll/Torah in lap -->
  <rect x="40" y="70" width="16" height="20" rx="2" fill="none" stroke="#c9a227" stroke-width="1.5"/>
  <text x="48" y="83" text-anchor="middle" font-family="Georgia, serif" font-size="7" fill="#c9a227">TORA</text>

  <!-- Hands holding scroll -->
  <path d="M36 55 L40 70" fill="none" stroke="#f5f2eb" stroke-width="1.5"/>
  <path d="M60 55 L56 70" fill="none" stroke="#f5f2eb" stroke-width="1.5"/>

  <!-- Water at feet (hidden knowledge) -->
  <path d="M30 100 C35 98 40 100 45 98 C50 100 55 98 60 100 C65 98 70 100 75 98"
        fill="none" stroke="#c9a227" stroke-width="1" opacity="0.5"/>

  <!-- Bottom decorative line -->
  <line x1="24" y1="108" x2="72" y2="108" stroke="#c9a227" stroke-width="1"/>

  <!-- Card name -->
  <text x="48" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="7" fill="#c9a227" font-weight="600">THE HIGH</text>
  <text x="48" y="132" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#c9a227" font-weight="600">PRIESTESS</text>
</svg>
