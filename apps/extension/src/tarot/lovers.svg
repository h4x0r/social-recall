<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 144">
  <defs>
    <linearGradient id="lovers-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#2a2a2a"/>
    </linearGradient>
    <radialGradient id="angel-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#c9a227;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#c9a227;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Card background -->
  <rect width="96" height="144" rx="4" fill="url(#lovers-bg)"/>
  <rect x="2" y="2" width="92" height="140" rx="3" fill="none" stroke="#c9a227" stroke-width="1.5"/>

  <!-- Art deco corner decorations -->
  <path d="M8 8 L20 8 L20 12 L12 12 L12 20 L8 20 Z" fill="#c9a227" opacity="0.6"/>
  <path d="M88 8 L76 8 L76 12 L84 12 L84 20 L88 20 Z" fill="#c9a227" opacity="0.6"/>
  <path d="M8 136 L20 136 L20 132 L12 132 L12 124 L8 124 Z" fill="#c9a227" opacity="0.6"/>
  <path d="M88 136 L76 136 L76 132 L84 132 L84 124 L88 124 Z" fill="#c9a227" opacity="0.6"/>

  <!-- Angel glow -->
  <circle cx="48" cy="30" r="18" fill="url(#angel-glow)"/>

  <!-- Angel/Cupid figure at top -->
  <circle cx="48" cy="24" r="5" fill="none" stroke="#c9a227" stroke-width="1.5"/>

  <!-- Angel wings -->
  <path d="M38 20 C32 18 28 22 30 28 C32 24 36 22 40 24" fill="none" stroke="#c9a227" stroke-width="1"/>
  <path d="M58 20 C64 18 68 22 66 28 C64 24 60 22 56 24" fill="none" stroke="#c9a227" stroke-width="1"/>

  <!-- Rays from angel -->
  <line x1="48" y1="32" x2="48" y2="40" stroke="#c9a227" stroke-width="1"/>
  <line x1="40" y1="30" x2="35" y2="35" stroke="#c9a227" stroke-width="1"/>
  <line x1="56" y1="30" x2="61" y2="35" stroke="#c9a227" stroke-width="1"/>

  <!-- Cloud/divider -->
  <path d="M20 42 C25 38 35 40 40 42 C45 38 55 40 60 42 C65 38 75 40 80 42" fill="none" stroke="#c9a227" stroke-width="1" opacity="0.5"/>

  <!-- Left figure (Eve) -->
  <circle cx="30" cy="55" r="6" fill="none" stroke="#f5f2eb" stroke-width="1.5"/>
  <path d="M24 61 L30 59 L36 61 L38 90 L30 95 L22 90 Z" fill="none" stroke="#f5f2eb" stroke-width="1.5"/>

  <!-- Tree behind Eve -->
  <line x1="15" y1="50" x2="15" y2="100" stroke="#c9a227" stroke-width="1.5"/>
  <circle cx="15" cy="48" r="5" fill="none" stroke="#c9a227" stroke-width="1"/>
  <circle cx="12" cy="55" r="4" fill="none" stroke="#c9a227" stroke-width="1"/>
  <circle cx="18" cy="55" r="4" fill="none" stroke="#c9a227" stroke-width="1"/>

  <!-- Apple/fruit on tree -->
  <circle cx="15" cy="52" r="2" fill="#c9a227"/>

  <!-- Right figure (Adam) -->
  <circle cx="66" cy="55" r="6" fill="none" stroke="#f5f2eb" stroke-width="1.5"/>
  <path d="M60 61 L66 59 L72 61 L74 90 L66 95 L58 90 Z" fill="none" stroke="#f5f2eb" stroke-width="1.5"/>

  <!-- Tree of life behind Adam -->
  <line x1="81" y1="50" x2="81" y2="100" stroke="#c9a227" stroke-width="1.5"/>
  <path d="M76 48 L81 42 L86 48" fill="none" stroke="#c9a227" stroke-width="1"/>
  <path d="M77 55 L81 50 L85 55" fill="none" stroke="#c9a227" stroke-width="1"/>
  <path d="M78 62 L81 57 L84 62" fill="none" stroke="#c9a227" stroke-width="1"/>

  <!-- Heart/connection between figures -->
  <path d="M42 75 C42 70 48 65 48 70 C48 65 54 70 54 75 C54 80 48 85 48 85 C48 85 42 80 42 75"
        fill="none" stroke="#c9a227" stroke-width="1.5"/>

  <!-- Ground -->
  <path d="M10 98 C30 95 66 95 86 98" fill="none" stroke="#c9a227" stroke-width="1"/>

  <!-- Bottom decorative line -->
  <line x1="24" y1="108" x2="72" y2="108" stroke="#c9a227" stroke-width="1"/>

  <!-- Card name -->
  <text x="48" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#c9a227" font-weight="600">THE</text>
  <text x="48" y="133" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#c9a227" font-weight="600">LOVERS</text>
</svg>
