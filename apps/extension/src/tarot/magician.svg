<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 144">
  <defs>
    <linearGradient id="magician-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#2a2a2a"/>
    </linearGradient>
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4b84a"/>
      <stop offset="100%" style="stop-color:#a68820"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect width="96" height="144" rx="4" fill="url(#magician-bg)"/>
  <rect x="2" y="2" width="92" height="140" rx="3" fill="none" stroke="#c9a227" stroke-width="1.5"/>

  <!-- Art deco corner decorations -->
  <path d="M8 8 L20 8 L20 12 L12 12 L12 20 L8 20 Z" fill="#c9a227" opacity="0.6"/>
  <path d="M88 8 L76 8 L76 12 L84 12 L84 20 L88 20 Z" fill="#c9a227" opacity="0.6"/>
  <path d="M8 136 L20 136 L20 132 L12 132 L12 124 L8 124 Z" fill="#c9a227" opacity="0.6"/>
  <path d="M88 136 L76 136 L76 132 L84 132 L84 124 L88 124 Z" fill="#c9a227" opacity="0.6"/>

  <!-- Top decorative line -->
  <line x1="24" y1="20" x2="72" y2="20" stroke="#c9a227" stroke-width="1"/>
  <polygon points="48,16 52,20 48,24 44,20" fill="#c9a227"/>

  <!-- Infinity symbol above head -->
  <path d="M38 35 C38 30 43 30 48 35 C53 30 58 30 58 35 C58 40 53 40 48 35 C43 40 38 40 38 35"
        fill="none" stroke="#c9a227" stroke-width="1.5"/>

  <!-- Magician figure - geometric art deco style -->
  <circle cx="48" cy="52" r="8" fill="none" stroke="#f5f2eb" stroke-width="1.5"/>

  <!-- Body/robe -->
  <path d="M40 60 L48 58 L56 60 L58 90 L48 95 L38 90 Z" fill="none" stroke="#f5f2eb" stroke-width="1.5"/>

  <!-- Raised wand arm -->
  <line x1="56" y1="65" x2="70" y2="45" stroke="#f5f2eb" stroke-width="1.5"/>
  <!-- Wand -->
  <line x1="68" y1="42" x2="74" y2="35" stroke="#c9a227" stroke-width="2"/>
  <circle cx="75" cy="34" r="2" fill="#c9a227"/>

  <!-- Pointing down arm -->
  <line x1="40" y1="65" x2="28" y2="80" stroke="#f5f2eb" stroke-width="1.5"/>

  <!-- Table with tools -->
  <rect x="20" y="98" width="56" height="4" fill="#c9a227"/>

  <!-- Four elements on table -->
  <circle cx="28" cy="96" r="3" fill="none" stroke="#c9a227" stroke-width="1"/> <!-- Pentacle -->
  <polygon points="40,93 43,98 37,98" fill="#c9a227"/> <!-- Sword point -->
  <rect x="50" y="93" width="4" height="5" fill="#c9a227"/> <!-- Wand -->
  <path d="M62 98 C60 94 64 94 62 98" fill="#c9a227"/> <!-- Cup -->

  <!-- Bottom decorative elements -->
  <line x1="24" y1="110" x2="72" y2="110" stroke="#c9a227" stroke-width="1"/>

  <!-- Card name -->
  <text x="48" y="125" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#c9a227" font-weight="600">THE</text>
  <text x="48" y="135" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#c9a227" font-weight="600">MAGICIAN</text>
</svg>
