<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 144">
  <defs>
    <linearGradient id="star-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#2a2a2a"/>
    </linearGradient>
    <radialGradient id="star-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#c9a227;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#c9a227;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Card background -->
  <rect width="96" height="144" rx="4" fill="url(#star-bg)"/>
  <rect x="2" y="2" width="92" height="140" rx="3" fill="none" stroke="#c9a227" stroke-width="1.5"/>

  <!-- Art deco corner decorations -->
  <path d="M8 8 L20 8 L20 12 L12 12 L12 20 L8 20 Z" fill="#c9a227" opacity="0.6"/>
  <path d="M88 8 L76 8 L76 12 L84 12 L84 20 L88 20 Z" fill="#c9a227" opacity="0.6"/>
  <path d="M8 136 L20 136 L20 132 L12 132 L12 124 L8 124 Z" fill="#c9a227" opacity="0.6"/>
  <path d="M88 136 L76 136 L76 132 L84 132 L84 124 L88 124 Z" fill="#c9a227" opacity="0.6"/>

  <!-- Central large star glow -->
  <circle cx="48" cy="28" r="15" fill="url(#star-glow)"/>

  <!-- Central large 8-pointed star -->
  <polygon points="48,14 51,24 61,24 53,30 56,40 48,34 40,40 43,30 35,24 45,24" fill="#c9a227"/>

  <!-- Seven smaller stars around -->
  <polygon points="22,20 23,22 25,22 23.5,23.5 24,26 22,24.5 20,26 20.5,23.5 19,22 21,22" fill="#c9a227"/>
  <polygon points="74,20 75,22 77,22 75.5,23.5 76,26 74,24.5 72,26 72.5,23.5 71,22 73,22" fill="#c9a227"/>
  <polygon points="18,38 19,40 21,40 19.5,41.5 20,44 18,42.5 16,44 16.5,41.5 15,40 17,40" fill="#c9a227"/>
  <polygon points="78,38 79,40 81,40 79.5,41.5 80,44 78,42.5 76,44 76.5,41.5 75,40 77,40" fill="#c9a227"/>
  <polygon points="25,52 26,54 28,54 26.5,55.5 27,58 25,56.5 23,58 23.5,55.5 22,54 24,54" fill="#c9a227"/>
  <polygon points="71,52 72,54 74,54 72.5,55.5 73,58 71,56.5 69,58 69.5,55.5 68,54 70,54" fill="#c9a227"/>
  <polygon points="48,48 49,50 51,50 49.5,51.5 50,54 48,52.5 46,54 46.5,51.5 45,50 47,50" fill="#c9a227"/>

  <!-- Figure kneeling by water -->
  <circle cx="40" cy="68" r="6" fill="none" stroke="#f5f2eb" stroke-width="1.5"/>

  <!-- Body kneeling -->
  <path d="M34 74 L40 72 L46 74 L48 90 L40 95 L32 90 Z" fill="none" stroke="#f5f2eb" stroke-width="1.5"/>

  <!-- Leg kneeling -->
  <path d="M40 90 L48 95 L55 92" fill="none" stroke="#f5f2eb" stroke-width="1.5"/>

  <!-- Arms pouring water -->
  <line x1="34" y1="78" x2="22" y2="85" stroke="#f5f2eb" stroke-width="1.5"/>
  <line x1="46" y1="78" x2="60" y2="88" stroke="#f5f2eb" stroke-width="1.5"/>

  <!-- Two vessels/urns -->
  <ellipse cx="20" cy="88" rx="4" ry="3" fill="none" stroke="#c9a227" stroke-width="1.5"/>
  <ellipse cx="62" cy="92" rx="4" ry="3" fill="none" stroke="#c9a227" stroke-width="1.5"/>

  <!-- Water flowing from urns -->
  <path d="M20 91 C22 95 18 98 20 102" fill="none" stroke="#c9a227" stroke-width="1" stroke-dasharray="2,2"/>
  <path d="M62 95 C64 98 60 100 62 102" fill="none" stroke="#c9a227" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Pool of water -->
  <ellipse cx="40" cy="100" rx="20" ry="4" fill="none" stroke="#c9a227" stroke-width="1"/>

  <!-- Bottom decorative line -->
  <line x1="24" y1="108" x2="72" y2="108" stroke="#c9a227" stroke-width="1"/>

  <!-- Card name -->
  <text x="48" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#c9a227" font-weight="600">THE</text>
  <text x="48" y="133" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#c9a227" font-weight="600">STAR</text>
</svg>
