<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 144">
  <defs>
    <linearGradient id="strength-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#2a2a2a"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect width="96" height="144" rx="4" fill="url(#strength-bg)"/>
  <rect x="2" y="2" width="92" height="140" rx="3" fill="none" stroke="#c9a227" stroke-width="1.5"/>

  <!-- Art deco corner decorations -->
  <path d="M8 8 L20 8 L20 12 L12 12 L12 20 L8 20 Z" fill="#c9a227" opacity="0.6"/>
  <path d="M88 8 L76 8 L76 12 L84 12 L84 20 L88 20 Z" fill="#c9a227" opacity="0.6"/>
  <path d="M8 136 L20 136 L20 132 L12 132 L12 124 L8 124 Z" fill="#c9a227" opacity="0.6"/>
  <path d="M88 136 L76 136 L76 132 L84 132 L84 124 L88 124 Z" fill="#c9a227" opacity="0.6"/>

  <!-- Infinity symbol above head -->
  <path d="M38 22 C38 17 43 17 48 22 C53 17 58 17 58 22 C58 27 53 27 48 22 C43 27 38 27 38 22"
        fill="none" stroke="#c9a227" stroke-width="1.5"/>

  <!-- Figure (woman) -->
  <circle cx="48" cy="40" r="7" fill="none" stroke="#f5f2eb" stroke-width="1.5"/>

  <!-- Flowing hair/wreath -->
  <path d="M41 36 C38 38 36 42 38 46" fill="none" stroke="#c9a227" stroke-width="1"/>
  <path d="M55 36 C58 38 60 42 58 46" fill="none" stroke="#c9a227" stroke-width="1"/>

  <!-- Flowers in hair -->
  <circle cx="40" cy="35" r="2" fill="#c9a227"/>
  <circle cx="56" cy="35" r="2" fill="#c9a227"/>

  <!-- Body/robe -->
  <path d="M38 47 L48 45 L58 47 L62 95 L48 100 L34 95 Z" fill="none" stroke="#f5f2eb" stroke-width="1.5"/>

  <!-- Arms reaching down to lion -->
  <path d="M42 55 L35 70 L42 78" fill="none" stroke="#f5f2eb" stroke-width="1.5"/>
  <path d="M54 55 L61 70 L54 78" fill="none" stroke="#f5f2eb" stroke-width="1.5"/>

  <!-- Lion - geometric art deco style -->
  <!-- Lion body -->
  <ellipse cx="48" cy="82" rx="18" ry="10" fill="none" stroke="#c9a227" stroke-width="1.5"/>

  <!-- Lion head -->
  <circle cx="48" cy="70" r="8" fill="none" stroke="#c9a227" stroke-width="1.5"/>

  <!-- Lion mane (radiating lines) -->
  <line x1="48" y1="62" x2="48" y2="58" stroke="#c9a227" stroke-width="1"/>
  <line x1="42" y1="64" x2="38" y2="61" stroke="#c9a227" stroke-width="1"/>
  <line x1="54" y1="64" x2="58" y2="61" stroke="#c9a227" stroke-width="1"/>
  <line x1="40" y1="70" x2="35" y2="70" stroke="#c9a227" stroke-width="1"/>
  <line x1="56" y1="70" x2="61" y2="70" stroke="#c9a227" stroke-width="1"/>

  <!-- Lion face details -->
  <circle cx="45" cy="68" r="1.5" fill="#c9a227"/>
  <circle cx="51" cy="68" r="1.5" fill="#c9a227"/>
  <path d="M46 73 L48 75 L50 73" fill="none" stroke="#c9a227" stroke-width="1"/>

  <!-- Lion tail -->
  <path d="M66 82 C72 80 74 85 70 88" fill="none" stroke="#c9a227" stroke-width="1.5"/>

  <!-- Lion legs -->
  <line x1="35" y1="88" x2="32" y2="98" stroke="#c9a227" stroke-width="1.5"/>
  <line x1="40" y1="90" x2="38" y2="98" stroke="#c9a227" stroke-width="1.5"/>
  <line x1="56" y1="90" x2="58" y2="98" stroke="#c9a227" stroke-width="1.5"/>
  <line x1="61" y1="88" x2="64" y2="98" stroke="#c9a227" stroke-width="1.5"/>

  <!-- Bottom decorative line -->
  <line x1="24" y1="108" x2="72" y2="108" stroke="#c9a227" stroke-width="1"/>

  <!-- Card name -->
  <text x="48" y="125" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#c9a227" font-weight="600">STRENGTH</text>
</svg>
